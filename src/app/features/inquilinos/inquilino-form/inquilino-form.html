<div class="form-container">
  <h2 class="form-title">Datos del Inquilino</h2>

  <div class="image-selector-card">
    <div class="selector-controls">
      <button type="button" class="nav-btn" (click)="anterior()">⬅</button>
      
      <div class="imagen-container">
        <img [src]="imagenes[index]" alt="Vista previa del inquilino" />
      </div>
      
      <button type="button" class="nav-btn" (click)="siguiente()">➡</button>
    </div>

    <button type="button" (click)="elegirImagen()" class="btn-elegir">
      Confirmar Imagen Seleccionada
    </button>

    <div *ngIf="form.get('fotoUrl')?.value" class="preview">
      <h4>Imagen Confirmada:</h4>
      <img
        [src]="form.get('fotoUrl')?.value"
        alt="Inquilino seleccionado">
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>Tipo de Persona</label>
      <select formControlName="tipoPersona">
        <option value="NATURAL">Persona Natural</option>
        <option value="JURIDICA">Persona Jurídica</option>
      </select>
    </div>

    <div class="form-group full-width">
      <label>Nombre Completo / Razón Social</label>
    <input
      formControlName="nombreCompleto"
      placeholder="Nombre completo"
      (keypress)="soloLetras($event)">
    </div>

<div class="form-group">
  <label>DNI / RUC</label>

  <input
    formControlName="documentoIdentidad"
    placeholder="DNI / RUC"
    (keypress)="soloNumeros($event)">

  <div
    class="error"
    *ngIf="
      form.get('documentoIdentidad')?.invalid &&
      form.get('documentoIdentidad')?.touched
    ">
    Debe ingresar un DNI (8 dígitos) o RUC (11 dígitos).
  </div>
</div>

<div class="form-group">
  <label>Teléfono</label>

  <input
    formControlName="telefono"
    placeholder="Teléfono"
    (keypress)="soloNumeros($event)">

  <div
    class="error"
    *ngIf="
      form.get('telefono')?.invalid &&
      form.get('telefono')?.touched
    ">
    Debe ingresar un teléfono válido de 9 dígitos.
  </div>
</div>

    <div class="form-group full-width">
      <label>Email</label>
      <input
      formControlName="email"
      placeholder="correo@ejemplo.com">
      <div
      class="error"
      *ngIf="form.get('email')?.invalid && form.get('email')?.touched">

      Debe ingresar un correo electrónico válido.</div>
    </div>



  </div>

  <div class="form-actions">
    <button type="button" class="btn-volver" (click)="volver()">
      Volver al listado
    </button>
    
    <button type="button" class="btn-guardar" (click)="guardar()">
      Guardar Inquilino
    </button>
  </div>

  </form>
</div>
