<h2>Inquilinos</h2>

<button routerLink="/inquilinos/nuevo" class="btn-add">
  Nuevo Inquilino
</button>

<div class="grid-container">
  <div class="card" *ngFor="let inq of inquilinos">

    <div class="image-container">
      <span class="tipo-badge">{{ inq.tipoPersona }}</span>

      <img 
        [src]="'/inquilinos/' + inq.codigo + '.jpg'"
        [alt]="inq.nombreCompleto"
        onerror="this.src='/inquilinos/default.jpg'"
      >
    </div>

    <div class="info">
      <h3>{{ inq.nombreCompleto }}</h3>

      <p class="email">
        {{ inq.email || 'Sin email' }}
      </p>

      <p>
        <strong>DNI/RUC:</strong>
        {{ inq.documentoIdentidad || 'No registrado' }}
      </p>

      <p>
        <strong>Teléfono:</strong>
        {{ inq.telefono || 'No registrado' }}
      </p>
    </div>
<button 
[routerLink]="['/caja', inq.id]"  
class="btn-contacto"
  >
  Movimientos bancarios
</button>

  </div>
</div>
