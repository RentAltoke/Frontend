<div class="page-container" *ngIf="usuario; else sinSesion">
  <div class="usuario-card">

    <div class="usuario-header">
      <h2>Perfil de Usuario</h2>
    </div>

    <div class="usuario-body">

      <div class="usuario-avatar">
        <img src="/logo2.png" alt="Usuario">
      </div>

      <div class="usuario-info">

        <h3>{{ usuario.email }}</h3>

        <div class="badges">
          <span class="badge rol">Sesión activa</span>
        </div>

        <div class="extra">
          <p><strong>Correo:</strong> {{ usuario.email }}</p>
          <p><strong>Sesión válida hasta:</strong> {{ usuario.expira }}</p>
        </div>

      </div>
    </div>
  </div>
</div>

<ng-template #sinSesion>
  <div class="page-container">
    <p>No hay sesión activa.</p>
  </div>
</ng-template>
