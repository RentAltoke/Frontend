<div class="page-container">
  <header class="section-header">
    <div class="title-group">
      <h2>Gestión de Inmuebles</h2>
      <p>Administre su cartera de edificios, pisos y locales comerciales.</p>
    </div>
    <button (click)="nuevo()" class="btn-add">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M6 12H18M12 6V18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg> Añadir Inme
    </button>
  </header>

  <div class="grid">
    <div class="card" *ngFor="let i of inmuebles">

        <span class="badge-tipo">{{i.tipo}}</span>
        <img [src]="i.imagenUrl" alt="Propiedad">

        <div class="city-tag">

        </div>
      </div>

      <div class="info">
        <span class="cp-label">CP {{i.codigoPostal}}</span>
        <div class="header-info">
          <h3>{{i.nombre}}</h3>
        </div>
        
        <p class="direccion">{{i.direccion}} {{i.numero}}</p>
        <p class="desc">{{i.descripcion}}</p>

        <div class="card-footer">
          <button [routerLink]="['/unidades', i.id]" class="btn-main">
            Explorar Unidades →
          </button>

            </button>
            <button (click)="eliminar(i.id)" class="btn-icon delete">
