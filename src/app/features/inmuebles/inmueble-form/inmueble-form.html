<div class="form-container">
    <form [formGroup]="form"> 
    <h2 class="form-title">Datos del Inmueble</h2>

  <div class="image-selector-card">
    <div class="selector-controls">
      <button class="nav-btn" (click)="anterior()">⬅</button>
      
      <div class="imagen-container">
        <img [src]="imagenes[index]" alt="Vista previa del inmueble" />
      </div>
      
      <button class="nav-btn" (click)="siguiente()">➡</button>
    </div>

    <button (click)="elegirImagen()" class="btn-elegir">
      Confirmar Imagen Seleccionada
    </button>

    <div  *ngIf="form.get('imagenUrl')?.value" class="preview">
      <h4>Imagen Confirmada:</h4>
      <img [src]="form.get('imagenUrl')?.value" alt="Inmueble seleccionado">
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group full-width">
      <label>Nombre del Inmueble</label>
      <input formControlName="nombre"  (keypress)="soloLetras($event)" placeholder="Ej: Departamento Centro">
    </div>

    <div class="form-group">
      <label>Tipo de Inmueble</label>
      <select formControlName="tipo">
        <option value="RESIDENCIAL">Residencial</option>
        <option value="COMERCIAL">Comercial</option>
        <option value="INDUSTRIAL">Industrial</option>
        <option value="ESPECIAL">Especial</option>
      </select>
    </div>

    <div class="form-group">
      <label>Ciudad</label>
      <input formControlName="ciudad" (keypress)="soloLetras($event)"  placeholder="Ej: Lima">
    </div>

    <div class="form-group full-width">
      <label>Dirección</label>
      <input formControlName="direccion" (keypress)="soloLetras($event)"  placeholder="Calle, Avenida...">
    </div>

    <div class="form-group">
      <label>Número</label>
      <input formControlName="numero"  (keypress)="soloNumeros($event)"  placeholder="Ej: 123">
    </div>

    <div class="form-group">
      <label>Código Postal</label>
      <input formControlName="codigoPostal"  (keypress)="soloNumeros($event)"  placeholder="Ej: 28001">
    </div>

    <div class="form-group full-width">
      <label>Descripción</label>
      <input formControlName="descripcion"   (keypress)="soloLetras($event)" placeholder="Detalles adicionales sobre el inmueble...">
    </div>
  </div>

  <div class="form-actions">
    <button class="btn-volver" (click)="volver()">
      Volver al listado
    </button>
    
    <button class="btn-guardar" (click)="guardar()">
      Guardar Inmueble
    </button>
  </div>
</form>
</div>
